<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#15110f">
<title>Rita · Somos Así</title>
<style>
/* Tablero de estudio en una pantalla: cabecera, teleprompter al medio, consola con el
   botón grande abajo. Oscuro a propósito: es un estudio de noche. */
:root{
  --bg:#15110f; --surface:#1f1916; --surface-2:#2a2320; --line:#3a302b;
  --fg:#f4ede5; --muted:#a89a8c;
  --onair:#e5412e; --onair-soft:rgba(229,65,46,.16);
  --listen:#f2a83b; --listen-soft:rgba(242,168,59,.18);
  --think:#6d8fd6; --ok:#5fc48a;
  --display:"Archivo Black","Arial Narrow",Impact,"Helvetica Neue",Arial,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--listen);outline-offset:2px}
input{font:inherit;color:inherit}
[hidden]{display:none!important}

.app{height:100%;display:flex;flex-direction:column;gap:12px;max-width:860px;margin:0 auto;
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}

/* Cabecera */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.14em;font-size:.68rem;color:var(--muted)}
.name{font-family:var(--display);font-size:clamp(2.4rem,9vw,4rem);line-height:.9;margin:0;letter-spacing:-.01em}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);
  font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-size:.64rem}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.escuchando{border-color:var(--listen);color:#ffd79a;background:var(--listen-soft)}
.pill.escuchando .dot{background:var(--listen)}
.pill.pensando{border-color:var(--think);color:#c3d3f5}
.pill.pensando .dot{background:var(--think);animation:parpadeo 1s infinite}
.pill.hablando{border-color:var(--onair);color:#ffb3a8;background:var(--onair-soft)}
.pill.hablando .dot{background:var(--onair);animation:pulso 1.6s infinite}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(229,65,46,.55)}70%{box-shadow:0 0 0 9px rgba(229,65,46,0)}100%{box-shadow:0 0 0 0 rgba(229,65,46,0)}}
@keyframes parpadeo{50%{opacity:.3}}

/* Avisos */
.aviso{padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:.9rem;color:var(--muted)}
.aviso b{color:var(--fg);font-weight:600}
.aviso.mal{border-color:#6a4a1d;background:#2a1f12;color:#f0cf9a}
.aviso.mal b{color:#ffe1b3}

/* Teleprompter */
.prompter{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.respuesta{flex:1;min-height:0;overflow-y:auto;padding:18px 20px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.respuesta .quien{font-family:var(--display);text-transform:uppercase;letter-spacing:.14em;font-size:.64rem;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between}
.respuesta .quien .seg{font-family:var(--mono);letter-spacing:0;text-transform:none;font-size:.72rem}
.respuesta p{margin:0;font-size:clamp(1.25rem,3.4vw,1.7rem);line-height:1.4;font-weight:500;white-space:pre-wrap}
.respuesta p.pensando{color:var(--muted);font-style:italic}
.respuesta p.pensando::after{content:"…";animation:puntos 1.2s steps(3,end) infinite}
@keyframes puntos{0%{content:""}33%{content:"."}66%{content:".."}100%{content:"..."}}
.oido{font-family:var(--mono);font-size:.85rem;color:var(--muted);padding:0 4px;min-height:1.3em;overflow-wrap:anywhere}
.oido b{color:var(--listen);font-weight:500}
.historial{max-height:28%;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:0 4px}
.historial:empty{display:none}
.turno{font-size:.86rem;color:var(--muted);display:grid;grid-template-columns:3.2em 1fr;gap:8px;overflow-wrap:anywhere}
.turno .r{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-size:.6rem;padding-top:.3em}
.turno.rita .r{color:#ffb3a8}
.turno.piso .r{color:var(--listen)}

/* Consola */
.consola{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.lado{display:flex;flex-direction:column;gap:8px}
.lado.der{align-items:flex-end}
.mic{width:96px;height:96px;border-radius:50%;background:var(--onair);color:#fff;display:grid;place-items:center;position:relative;
  box-shadow:0 10px 30px rgba(229,65,46,.3);transition:transform .12s ease,background .2s ease}
.mic:active{transform:scale(.95)}
.mic svg{width:38px;height:38px}
.mic .eti{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-size:.6rem;color:var(--muted);white-space:nowrap}
.mic.escuchando{background:var(--listen);color:#1a1200;animation:respira 1.4s ease-in-out infinite}
@keyframes respira{0%,100%{box-shadow:0 0 0 8px var(--listen-soft),0 10px 30px rgba(242,168,59,.3)}50%{box-shadow:0 0 0 18px rgba(242,168,59,.05),0 10px 30px rgba(242,168,59,.3)}}
.mic.pensando{background:var(--surface-2);color:var(--think);box-shadow:0 0 0 6px rgba(109,143,214,.15)}
.mic.hablando{background:var(--surface-2);color:#ffb3a8;box-shadow:0 0 0 6px var(--onair-soft)}
.mic[disabled]{background:var(--surface-2);color:var(--muted);box-shadow:none;cursor:not-allowed}
.btn{border-radius:12px;padding:11px 14px;background:var(--surface-2);border:1px solid var(--line);
  font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-size:.68rem;white-space:nowrap}
.btn:hover{background:#352c27}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.sw{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:.82rem;color:var(--muted);user-select:none}
.sw input{width:18px;height:18px;accent-color:var(--onair);margin:0}
.sw.on{color:var(--fg);border-color:#5a4a3f}
.campo{display:flex;gap:8px;margin-top:14px}
.campo input{flex:1;min-width:0;border-radius:12px;background:var(--surface);border:1px solid var(--line);padding:11px 14px;font-size:1rem}
.campo input::placeholder{color:var(--muted)}
.pie{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:.7rem;color:var(--muted)}
@media (max-width:560px){
  .consola{grid-template-columns:1fr auto 1fr;gap:8px}
  .btn{padding:10px 10px;font-size:.62rem}
  .sw{padding:8px 10px;font-size:.76rem}
}

/* Puerta */
.puerta{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;padding:24px 16px;text-align:center}
.puerta .name{font-size:clamp(3.4rem,16vw,7rem)}
.puerta form{display:flex;gap:8px;width:min(100%,360px)}
.puerta input{flex:1;min-width:0;border-radius:12px;background:var(--surface);border:1px solid var(--line);padding:14px 16px;font-size:1.05rem;text-align:center;letter-spacing:.08em}
.puerta .btn{background:var(--onair);border-color:var(--onair);color:#fff}
.puerta .err{color:#ffb3a8;font-size:.9rem;min-height:1.3em}
.puerta .hint{color:var(--muted);font-size:.85rem;max-width:34ch}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="puerta" class="puerta" hidden>
  <div class="eyebrow">Somos Así</div>
  <h1 class="name">Rita</h1>
  <p class="hint">La compañera de piso del programa. Ingresá el código del estudio para entrar.</p>
  <form id="formPuerta" autocomplete="off">
    <input id="codigo" type="password" placeholder="código" inputmode="text" autocapitalize="none" aria-label="Código de acceso">
    <button class="btn" type="submit">Entrar</button>
  </form>
  <div id="errPuerta" class="err" aria-live="polite"></div>
</div>

<div id="app" class="app" hidden>
  <header class="top">
    <div>
      <div class="eyebrow">Somos Así</div>
      <h1 class="name">Rita</h1>
    </div>
    <span id="pill" class="pill"><span class="dot"></span><span id="pillTexto">Lista</span></span>
  </header>

  <div id="aviso" class="aviso" hidden></div>

  <section class="prompter">
    <div class="respuesta">
      <div class="quien"><span>Rita</span><span class="seg" id="seg"></span></div>
      <p id="respuesta">Acá estoy. Tocá el botón y hablá, que para eso vine.</p>
    </div>
    <div class="oido" id="oido" aria-live="polite"></div>
    <div class="historial" id="historial"></div>
  </section>

  <section class="consola">
    <div class="lado">
      <label class="sw" id="swLibre"><input id="libre" type="checkbox"> Manos libres</label>
      <label class="sw on" id="swVoz"><input id="vozOn" type="checkbox" checked> Voz</label>
    </div>
    <button id="mic" class="mic" aria-label="Hablar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/><path d="M8 21h8"/></svg>
      <span class="eti" id="eti">Hablar</span>
    </button>
    <div class="lado der">
      <button class="btn" id="cortar" type="button">Cortar</button>
      <button class="btn" id="nueva" type="button">Nueva charla</button>
    </div>
  </section>

  <form class="campo" id="formTexto" autocomplete="off">
    <input id="texto" placeholder="O escribí la pregunta acá" aria-label="Pregunta escrita">
    <button class="btn" type="submit" id="enviar">Preguntar</button>
  </form>

  <div class="pie">
    <span id="pieOido">micrófono: …</span>
    <span id="pieVoz">voz: …</span>
  </div>
</div>

<script>
/* Estados de Rita: inactiva → escuchando → pensando → hablando → inactiva.
   Con "manos libres" prendido, al terminar de hablar vuelve sola a escuchar. */
const $ = id => document.getElementById(id);
const puerta = $("puerta"), app = $("app");
const respuestaEl = $("respuesta"), segEl = $("seg"), oidoEl = $("oido"), historialEl = $("historial");
const micBtn = $("mic"), etiEl = $("eti"), pill = $("pill"), pillTexto = $("pillTexto"), avisoEl = $("aviso");
const libreChk = $("libre"), vozChk = $("vozOn"), textoIn = $("texto");

let estado = "inactiva";
let ctl = null;              // AbortController del pedido en curso
let recog = null;            // SpeechRecognition del navegador (si existe)
let grabando = null;         // grabación propia (MediaRecorder) cuando no hay reconocimiento
let modoOido = "ninguno";    // "navegador" | "whisper" | "ninguno"
let hayWhisper = false;      // el servidor puede transcribir si el navegador no sabe
let micBloqueado = false;    // el navegador negó el micrófono: no insistir en manos libres
let ctx = null;              // AudioContext para reproducir los MP3
let fuenteActual = null;     // BufferSource sonando
let colaAudio = [];          // frases por reproducir, en orden
let sonando = false;
let textoListo = false;      // llegó "listo" del servidor
let turnoActual = { pregunta: "", frases: [] };
const prefs = cargar("rita-web", { libre: false, voz: true });

function cargar(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }
function guardar(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

/* ---------- Puerta ---------- */
async function arrancar(){
  const r = await fetch("/api/estado");
  if (r.status === 401) { puerta.hidden = false; $("codigo").focus(); return; }
  const e = await r.json();
  $("pieVoz").textContent = "voz: " + e.voz.replace(/Neural$/, "");
  hayWhisper = !!e.whisper;
  modoOido = (window.SpeechRecognition || window.webkitSpeechRecognition) ? "navegador" : (hayWhisper ? "whisper" : "ninguno");
  puerta.hidden = true; app.hidden = false;
  prepararOido();
  if (!window.isSecureContext) aviso("mal", "<b>El micrófono solo anda con HTTPS</b> (o en localhost). Abrí la URL https del túnel, ver README. Mientras tanto podés escribir.");
}
$("formPuerta").addEventListener("submit", async e => {
  e.preventDefault();
  const r = await fetch("/api/entrar", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ codigo: $("codigo").value }) });
  if (r.ok) { $("errPuerta").textContent = ""; arrancar(); }
  else { $("errPuerta").textContent = (await r.json()).error || "Ese código no es."; $("codigo").select(); }
});

/* ---------- Estado e interfaz ---------- */
function poner(nuevo){
  estado = nuevo;
  micBtn.className = "mic" + (nuevo === "inactiva" ? "" : " " + nuevo);
  pill.className = "pill" + (nuevo === "inactiva" ? "" : " " + nuevo);
  const textos = { inactiva: ["Hablar", prefs.libre ? "Manos libres" : "Lista"], escuchando: ["Escuchando", "Escuchando"], pensando: ["Cortar", "Pensando"], hablando: ["Cortar", "Al aire"] };
  etiEl.textContent = textos[nuevo][0];
  pillTexto.textContent = textos[nuevo][1];
  micBtn.disabled = modoOido === "ninguno" && nuevo === "inactiva";
}
function aviso(clase, html){
  if (!html) { avisoEl.hidden = true; return; }
  avisoEl.className = "aviso" + (clase ? " " + clase : ""); avisoEl.innerHTML = html; avisoEl.hidden = false;
}
function mostrarOido(texto, modo){
  // modo: "vivo" (lo que va entendiendo), "pregunta" (lo que mandó) o nada (un mensaje suelto).
  oidoEl.innerHTML = ""; if (!texto) return;
  if (!modo) { oidoEl.textContent = texto; return; }
  const b = document.createElement("b"); b.textContent = texto; oidoEl.append(modo === "pregunta" ? "Pregunta: " : "", b);
}
function agregarHistorial(rol, texto){
  const d = document.createElement("div"); d.className = "turno " + rol;
  const r = document.createElement("span"); r.className = "r"; r.textContent = rol === "rita" ? "Rita" : "Piso";
  const t = document.createElement("span"); t.textContent = texto;
  d.append(r, t); historialEl.prepend(d);
  while (historialEl.children.length > 12) historialEl.lastChild.remove();
}

/* ---------- Oído: reconocimiento del navegador o grabación para Whisper ---------- */
function prepararOido(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (modoOido === "navegador") {
    recog = new SR();
    recog.lang = "es-AR"; recog.interimResults = true; recog.continuous = false; recog.maxAlternatives = 1;
    let final = "", parcial = "";
    recog.onstart = () => { final = ""; parcial = ""; mostrarOido("Te escucho…", "vivo"); };
    recog.onresult = ev => {
      parcial = "";
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const r = ev.results[i];
        if (r.isFinal) final += r[0].transcript; else parcial += r[0].transcript;
      }
      mostrarOido((final + parcial).trim(), "vivo");
    };
    recog.onerror = ev => {
      if (ev.error === "not-allowed" || ev.error === "service-not-allowed") {
        micBloqueado = true;
        aviso("mal", "<b>El navegador no me deja usar el micrófono.</b> Permitilo en la barra de direcciones y recargá. Mientras tanto podés escribir.");
      } else if (ev.error === "network" && hayWhisper) {
        // Sin servicio de voz del navegador: pasamos a grabar y transcribir con Whisper.
        modoOido = "whisper"; prepararOido(); if (estado === "escuchando") { poner("inactiva"); escuchar(); }
        return;
      } else if (ev.error !== "no-speech" && ev.error !== "aborted") {
        mostrarOido("No pude escuchar (" + ev.error + "). Probá de nuevo.");
      }
    };
    recog.onend = () => {
      if (estado !== "escuchando") return;
      const t = (final + parcial).trim();
      if (t) preguntar(t);
      else if (micBloqueado) poner("inactiva");
      else if (prefs.libre) setTimeout(() => { if (estado === "inactiva" || estado === "escuchando") { poner("inactiva"); escuchar(); } }, 300);
      else { poner("inactiva"); mostrarOido("No escuché nada. Tocá y hablá."); }
    };
    $("pieOido").textContent = "micrófono: reconocimiento del navegador";
  } else if (modoOido === "whisper") {
    $("pieOido").textContent = "micrófono: Whisper en el servidor";
  } else {
    $("pieOido").textContent = "micrófono: no disponible, escribí la pregunta";
    micBtn.disabled = true;
  }
  poner("inactiva");
}

async function escuchar(){
  if (estado !== "inactiva" || modoOido === "ninguno") return;
  desbloquearAudio(); cortarVoz();
  poner("escuchando");
  if (modoOido === "navegador") {
    try { recog.start(); } catch(e) { poner("inactiva"); }
    return;
  }
  // Grabación propia con detección de silencio, parecida al modo --auto de la consola.
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch(e) { poner("inactiva"); micBloqueado = true; aviso("mal", "<b>No pude abrir el micrófono.</b> Permitilo en el navegador y recargá."); return; }
  const tipo = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || "";
  const rec = new MediaRecorder(stream, tipo ? { mimeType: tipo } : undefined);
  const trozos = [];
  rec.ondataavailable = ev => { if (ev.data.size) trozos.push(ev.data); };
  const actx = new (window.AudioContext || window.webkitAudioContext)();
  const src = actx.createMediaStreamSource(stream); const an = actx.createAnalyser(); an.fftSize = 1024; src.connect(an);
  const buf = new Float32Array(an.fftSize);
  let huboVoz = false, ultimaVoz = performance.now(), inicio = performance.now();
  mostrarOido("Te escucho…", "vivo");
  const medir = setInterval(() => {
    an.getFloatTimeDomainData(buf);
    let s = 0; for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i];
    const rms = Math.sqrt(s / buf.length);
    const ahora = performance.now();
    if (rms > 0.02) { huboVoz = true; ultimaVoz = ahora; }
    if ((huboVoz && ahora - ultimaVoz > 1200) || (!huboVoz && ahora - inicio > 8000) || ahora - inicio > 30000) grabando.parar();
  }, 50);
  grabando = {
    parar(){
      if (!grabando) return; grabando = null;
      clearInterval(medir); try { rec.stop(); } catch(e){}
      stream.getTracks().forEach(t => t.stop()); actx.close();
    }
  };
  rec.onstop = async () => {
    if (estado !== "escuchando") return;
    if (!huboVoz) {
      if (prefs.libre) { poner("inactiva"); setTimeout(escuchar, 300); } else { poner("inactiva"); mostrarOido("No escuché nada. Tocá y hablá."); }
      return;
    }
    poner("pensando"); mostrarOido("Transcribiendo…", "vivo");
    const blob = new Blob(trozos, { type: rec.mimeType || "audio/webm" });
    try {
      const r = await fetch("/api/transcribir", { method: "POST", headers: { "Content-Type": blob.type }, body: blob });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || "no pude transcribir");
      poner("inactiva");
      if (d.texto) preguntar(d.texto);
      else if (prefs.libre) setTimeout(escuchar, 300);
      else mostrarOido("No entendí nada. Tocá y hablá.");
    } catch(e) { poner("inactiva"); mostrarOido("No pude transcribir: " + e.message); }
  };
  rec.start();
}
function dejarDeEscuchar(){
  if (modoOido === "navegador") { try { recog.stop(); } catch(e){} }
  else if (grabando) grabando.parar();
}

/* ---------- Cerebro: pedido con streaming ---------- */
async function preguntar(texto){
  texto = (texto || "").trim();
  if (!texto || (estado !== "inactiva" && estado !== "escuchando")) return;
  if (estado === "escuchando") { estado = "inactiva"; dejarDeEscuchar(); }
  desbloquearAudio(); cortarVoz();
  poner("pensando");
  mostrarOido(texto, "pregunta");
  respuestaEl.textContent = "Pensando"; respuestaEl.className = "pensando"; segEl.textContent = "";
  aviso(null);
  turnoActual = { pregunta: texto, frases: [] };
  colaAudio = []; textoListo = false;
  const pendientes = new Map();  // n -> frase, esperando su audio
  ctl = new AbortController();
  try {
    const r = await fetch("/api/preguntar", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ texto }), signal: ctl.signal });
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      throw new Error(d.error || ("error " + r.status));
    }
    const lector = r.body.getReader(); const dec = new TextDecoder(); let buf = "";
    while (true) {
      const { value, done } = await lector.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const bloque = buf.slice(0, i); buf = buf.slice(i + 2);
        let ev = "", data = "";
        for (const linea of bloque.split("\n")) {
          if (linea.startsWith("event: ")) ev = linea.slice(7);
          else if (linea.startsWith("data: ")) data += linea.slice(6);
        }
        const d = data ? JSON.parse(data) : {};
        if (ev === "frase") {
          if (!turnoActual.frases.length) { respuestaEl.className = ""; respuestaEl.textContent = ""; }
          turnoActual.frases.push(d.texto);
          respuestaEl.textContent = turnoActual.frases.join(" ");
          pendientes.set(d.n, d.texto);
          poner("hablando");
        } else if (ev === "audio") {
          const frase = pendientes.get(d.n); pendientes.delete(d.n);
          encolarAudio({ n: d.n, mp3: d.mp3, texto: frase });
        } else if (ev === "fin") {
          segEl.textContent = d.segundos + " s";
          agregarHistorial("piso", texto); agregarHistorial("rita", d.texto);
        } else if (ev === "error") {
          respuestaEl.className = ""; respuestaEl.textContent = d.mensaje;
          aviso("mal", "<b>No salió.</b> " + d.mensaje);
          encolarAudio({ n: 0, mp3: null, texto: d.mensaje });
        } else if (ev === "listo") {
          textoListo = true;
        }
      }
    }
    ctl = null; textoListo = true;
    chequearFin();
  } catch(e) {
    if (e.name === "AbortError") return;  // lo cortaron a propósito
    respuestaEl.className = ""; respuestaEl.textContent = "";
    aviso("mal", "<b>No salió.</b> " + e.message);
    poner("inactiva");
  } finally {
    ctl = null;
  }
}

/* ---------- Voz: MP3 del servidor en orden, o la voz del navegador si no llegó ---------- */
function desbloquearAudio(){
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === "suspended") ctx.resume();
}
function encolarAudio(item){ colaAudio.push(item); colaAudio.sort((a, b) => a.n - b.n); bombear(); }
async function bombear(){
  if (sonando) return;
  sonando = true;
  while (colaAudio.length) {
    const it = colaAudio.shift();
    if (!prefs.voz) continue;
    try { await (it.mp3 ? tocarMp3(it.mp3) : leerConNavegador(it.texto)); } catch(e) {}
  }
  sonando = false;
  chequearFin();
}
function tocarMp3(b64){
  return new Promise(async resolve => {
    try {
      const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
      const buffer = await ctx.decodeAudioData(bytes.buffer);
      const src = ctx.createBufferSource(); src.buffer = buffer; src.connect(ctx.destination);
      src.onended = () => { if (fuenteActual === src) fuenteActual = null; resolve(); };
      fuenteActual = src; src.start();
    } catch(e) { resolve(); }
  });
}
function leerConNavegador(texto){
  return new Promise(resolve => {
    if (!window.speechSynthesis || !texto) return resolve();
    const u = new SpeechSynthesisUtterance(texto); u.lang = "es-AR";
    const voces = speechSynthesis.getVoices().filter(v => /^es/i.test(v.lang));
    const v = voces.find(v => /es-AR/i.test(v.lang)) || voces[0]; if (v) u.voice = v;
    u.onend = u.onerror = () => resolve();
    speechSynthesis.speak(u);
  });
}
function cortarVoz(){
  colaAudio = [];
  if (fuenteActual) { try { fuenteActual.stop(); } catch(e){} fuenteActual = null; }
  try { speechSynthesis.cancel(); } catch(e){}
}
function chequearFin(){
  // Terminó de verdad cuando no queda texto por llegar ni audio por sonar.
  if (!textoListo || sonando || colaAudio.length || ctl) return;
  if (estado !== "hablando" && estado !== "pensando") return;
  poner("inactiva");
  if (prefs.libre) setTimeout(() => { if (estado === "inactiva") escuchar(); }, 400);
}

/* ---------- Controles ---------- */
function cortar(){
  if (ctl) { ctl.abort(); fetch("/api/cortar", { method: "POST" }).catch(() => {}); }
  cortarVoz();
  if (estado === "escuchando") { estado = "inactiva"; dejarDeEscuchar(); }
  textoListo = true;
  poner("inactiva");
  pillTexto.textContent = "Cortada";
}
micBtn.addEventListener("click", () => {
  if (estado === "inactiva") escuchar();
  else if (estado === "escuchando") dejarDeEscuchar();   // manda lo que haya hasta acá
  else cortar();
});
$("cortar").addEventListener("click", cortar);
$("nueva").addEventListener("click", async () => {
  cortar();
  await fetch("/api/olvidar", { method: "POST" });
  historialEl.innerHTML = ""; oidoEl.textContent = ""; segEl.textContent = "";
  respuestaEl.className = ""; respuestaEl.textContent = "Charla nueva. Dale, preguntá.";
});
$("formTexto").addEventListener("submit", e => { e.preventDefault(); const t = textoIn.value; textoIn.value = ""; if (estado === "escuchando") cortar(); preguntar(t); });
libreChk.checked = prefs.libre; $("swLibre").classList.toggle("on", prefs.libre);
libreChk.addEventListener("change", () => {
  prefs.libre = libreChk.checked; guardar("rita-web", prefs); $("swLibre").classList.toggle("on", prefs.libre);
  if (estado === "inactiva") { poner("inactiva"); if (prefs.libre) escuchar(); }
});
vozChk.checked = prefs.voz; $("swVoz").classList.toggle("on", prefs.voz);
vozChk.addEventListener("change", () => { prefs.voz = vozChk.checked; guardar("rita-web", prefs); $("swVoz").classList.toggle("on", prefs.voz); if (!prefs.voz) cortarVoz(); });
document.addEventListener("keydown", e => {
  if (e.target === textoIn || e.target === $("codigo")) return;
  if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); micBtn.click(); }
  if (e.code === "Escape") cortar();
});

arrancar();
</script>
