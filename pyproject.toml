[project]
name = "rita-somosasi"
version = "0.1.0"
description = "Rita, la compañera de piso con IA de SomosAsi: escucha, busca y responde por voz al aire."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.3,<3",
    "edge-tts>=7.0",
    "faster-whisper>=1.1",
    "av>=11,<16",  # faster-whisper 1.2 no decodifica archivos con PyAV 16+
    "sounddevice>=0.5",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.scripts]
rita = "rita.main:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rita"]

[tool.pytest.ini_options]
testpaths = ["tests"]
